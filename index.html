<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3Fase</title>
<meta name="description" content="3Fase — Cantautori, produttori, dj. Visita il sito ufficiale.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{ height:100%; }

  body{
    font-family:'EB Garamond', serif;
    color:#fff;
    overflow:hidden;
  }

  .banner{
    position:relative;
    height:100vh;
    height:100dvh;
    width:100%;
    background-image:url('https://raw.githubusercontent.com/3fase/3fase.github.io/refs/heads/main/img/Home%203Fase.jpg');
    background-size:cover;
    background-position:center;
    animation: kenburns 24s ease-in-out infinite alternate;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    text-align:center;
  }

  @keyframes kenburns{
    from{ background-size:100%; }
    to{ background-size:112%; }
  }

  .banner::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    background:linear-gradient(0deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 28%, rgba(0,0,0,0) 55%);
  }

  .logo{
    position:fixed;
    top:1.2rem;
    left:1.2rem;
    z-index:5;
    width:78px;
    height:78px;
    object-fit:contain;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.45));
    opacity:0;
    animation: fadeIn 1s .2s ease forwards;
  }

  .content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.6rem;
    width:100%;
    max-width:640px;
    padding:0 5vw clamp(3rem, 8vh, 5rem);
    opacity:0;
    animation: fadeUp 1.1s .4s ease forwards;
  }

  .content p{
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.1rem, 2.4vw, 1.5rem);
    line-height:1.5;
    color:#000;
    text-shadow:0 1px 3px rgba(255,255,255,.35);
  }

  .cta{
    display:inline-block;
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-size:clamp(1rem, 2vw, 1.15rem);
    background:#fff;
    color:#1c1c1c;
    text-decoration:none;
    padding:.9rem 2.2rem;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    transition:background .3s ease, color .3s ease, transform .3s ease;
    white-space:nowrap;
  }

  .cta:hover,
  .cta:focus-visible{
    background:#1c1c1c;
    color:#fff;
    transform:translateY(-3px);
  }

  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(20px); }
    to{ opacity:1; transform:translateY(0); }
  }

  footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:2;
    text-align:center;
    padding:.9rem 4vw 1rem;
    background:linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,0));
  }

  footer p{
    font-size:.78rem;
    color:rgba(255,255,255,.85);
    line-height:1.6;
  }

  footer .footer-note{
    font-style:italic;
    max-width:560px;
    margin:0 auto .3rem;
  }

  footer a{
    color:#e8d3a0;
    text-decoration:underline;
    text-underline-offset:2px;
  }

  footer a:hover{ color:#fff; }

  @media (max-width:600px){
    .logo{ width:56px; height:56px; }
    .content{ gap:.5rem; }
    footer .footer-note{ display:none; }
  }

  @media (max-height:480px){
    .content{ padding-bottom:1.5rem; gap:.8rem; }
    footer{ display:none; }
  }
</style>
</head>
<body>
<img class="logo" src="https://raw.githubusercontent.com/3fase/3fase.github.io/refs/heads/main/img/Logo.png" alt="Logo 3Fase">
<div class="banner">
  <div class="content">
    <p>Cantautori, produttori, dj — tre voci, uno studio, un solo obiettivo: sognare.</p>
    <a class="cta" href="https://sites.google.com/view/trefase" target="_blank" rel="noopener">Visita il sito ufficiale</a>
  </div>
</div>
<footer>
  <p class="footer-note">Questo sito non utilizza cookie né strumenti di tracciamento. Il pulsante sopra rimanda al sito ufficiale su Google Sites.</p>
  <p>&copy; <span id="year"></span> 3Fase — <a href="mailto:aiskxx@yahoo.it">aiskxx@yahoo.it</a></p>
</footer>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
